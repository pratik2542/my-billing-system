  <style>
    /* Custom Print Styles to strictly match the paper bill look */
    @media print {
      @page {
        size: A4;
        margin: 0;
      }

      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
        background-color: #ffffff !important;
      }

      .no-print {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
      }

      /* Hide everything except the print portal / print container */
      body > *:not(#print-portal-root):not(.print-only-container):not(#electron-print-portal) {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        overflow: hidden !important;
      }

      #print-portal-root,
      #electron-print-portal,
      .print-only-container {
        display: block !important;
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        background: #ffffff !important;
        background-color: #ffffff !important;
        z-index: 99999 !important;
        overflow: visible !important;
        page-break-after: avoid !important;
      }

      #print-portal-root *,
      #electron-print-portal *,
      .print-only-container * {
        visibility: visible !important;
      }

      .print-bill-target,
      .print-container {
        width: 100% !important;
        max-width: 794px !important;
        margin: 0 auto !important;
        padding: 0 !important;
        background: #ffffff !important;
        background-color: #ffffff !important;
        transform: none !important;
        box-shadow: none !important;
        visibility: visible !important;
        display: block !important;
        overflow: visible !important;
        height: auto !important;
        min-height: 0 !important;
        page-break-after: avoid !important;
      }

      /* Reset min-height only on the main invoice container to prevent blank second page */
      /* Don't override height on all elements - that collapses empty rows */
      #history-view {
        min-height: 0 !important;
      }
    }

    .font-serif-custom {
      font-family: 'Crimson Text', serif;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Hide scrollbars globally (keep scrolling enabled) */
    html,
    body,
    #root,
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    #root::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    /* ── PDF Print Mode (Electron printToPDF) ─────────────────────────────── */
    /* When body has this class, hide the entire app and show only the target invoice */
    body.pdf-print-mode #root {
      visibility: hidden !important;
      overflow: hidden !important;
    }
    body.pdf-print-mode * {
      visibility: hidden !important;
    }
    /* Invoice generator hidden capture element */
    body.pdf-print-mode #invoice-capture-hidden,
    body.pdf-print-mode #invoice-capture-hidden * {
      visibility: visible !important;
    }
    /* Invoice history view (when printing from bill history) */
    body.pdf-print-mode #history-view,
    body.pdf-print-mode #history-view * {
      visibility: visible !important;
    }
    body.pdf-print-mode {
      background: white !important;
      overflow: hidden !important;
    }




  </style>
