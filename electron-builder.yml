appId: "com.universal.billing-system"
productName: "Universal Billing System"
copyright: "Copyright © 2025"

# Disable code signing — no certificate available
forceCodeSigning: false

# ─── Directories ──────────────────────────────────────────────────────────────
directories:
  output: "release"
  buildResources: "build-resources"

# ─── Files to include in the package ─────────────────────────────────────────
files:
  - dist/**/*
  - electron/**/*.js
  - electron/package.json
  - electron/migrations/**
  - "!electron/**/*.ts"
  - package.json
  - from: "node_modules/better-sqlite3"
    to: "node_modules/better-sqlite3"
  - from: "node_modules/bindings"
    to: "node_modules/bindings"
  - from: "node_modules/file-uri-to-path"
    to: "node_modules/file-uri-to-path"
  - from: "node_modules/node-machine-id"
    to: "node_modules/node-machine-id"
  - from: "node_modules/node-cron"
    to: "node_modules/node-cron"

# ─── Extra resources bundled inside the app (accessible via process.resourcesPath)
extraResources:
  - from: "electron/migrations"
    to: "electron/migrations"

# ─── ASAR packing ─────────────────────────────────────────────────────────────
# Exclude better-sqlite3 from asar — native .node files can't be inside asar
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"

# ─── Windows-specific ─────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.ico

# ─── NSIS Installer ───────────────────────────────────────────────────────────
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Universal Billing System"
  runAfterFinish: true
  artifactName: "${productName}-Setup-${version}.${ext}"
  include: build-resources/installer.nsh

# ─── Hooks ────────────────────────────────────────────────────────────────────
afterPack: build-resources/afterPack.cjs
beforeBuild: build-resources/beforeBuild.cjs

# ─── Auto Updater (disabled — offline use) ────────────────────────────────────
# publish: null  # Uncomment to enable auto-update publishing
